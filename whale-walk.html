function mulberry32(seed){ let t=seed>>>0; return function(){ t+=0x6D2B79F5;
  let r=Math.imul(t^t>>>15,1|t); r^=r+Math.imul(r^r>>>7,61|r); return ((r^r>>>14)>>>0)/4294967296; }; }
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function lerpAngle(a,b,t){ let d=(b-a)%(Math.PI*2); if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2; return a+d*t; }

/* =====================================================================
 *  渲染器 / 场景 / 相机

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance', preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);

/* 光照：冷调月光（阴影）+ 霓虹点光（青/品红/琥珀 局部辉光） */

[[0x35E0FF, 5, 7, 7],[0xFF4FD8, -18, 9, -12],[0xFFB04A, 16, 7, -20],[0x35E0FF, -9, 6, 16]]

/* =====================================================================
 *  材质工具：三阶 toon 渐变 / 描边
 * ===================================================================== */
const TOON = (()=>{ const d=new Uint8Array([70,150,255]);
  const t=new THREE.DataTexture(d,3,1,THREE.RedFormat);
  t.minFilter=t.magFilter=THREE.NearestFilter; t.needsUpdate=true; return t; })();
function toon(color){ return new THREE.MeshToonMaterial({color, gradientMap:TOON}); }
function toonVC(){ return new THREE.MeshToonMaterial({vertexColors:true, gradientMap:TOON}); }
const OUTLINE = new THREE.MeshBasicMaterial({color:C.ink, side:THREE.BackSide});
function outline(mesh, s=1.045){ const o=new THREE.Mesh(mesh.geometry, OUTLINE);
  o.scale.setScalar(s); o.castShadow=false; if(mesh.parent) mesh.add(o); return o; }
/* 顶点色三段渐变（沿包围盒某轴） */
function vcGradient(geom, axis, cA, cB, cC){
  const pos=geom.attributes.position; const n=pos.count;
  const cols=new Float32Array(n*3);
  const A=new THREE.Color(cA),B=new THREE.Color(cB),Ccol=new THREE.Color(cC),tmp=new THREE.Color();
  let mn=1e9,mx=-1e9;
  for(let i=0;i<n;i++){ const v=pos.getComponent(axis,i); if(v<mn)mn=v; if(v>mx)mx=v; }
  const span=(mx-mn)||1;
  for(let i=0;i<n;i++){ const t=clamp((pos.getComponent(axis,i)-mn)/span,0,1);
    if(t<0.5) tmp.copy(A).lerp(B,t*2); else tmp.copy(B).lerp(Ccol,(t-0.5)*2);
    cols[i*3]=tmp.r; cols[i*3+1]=tmp.g; cols[i*3+2]=tmp.b; }
  geom.setAttribute('color', new THREE.BufferAttribute(cols,3));
  return geom;
}
/* 管几何顶点：按环统一上色（避免 bbox 渐变产生环形条纹） */
function vcByRing(geom, tub, rad, cA, cB, cC){
  const n=geom.attributes.position.count;
  const cols=new Float32Array(n*3);
  const A=new THREE.Color(cA),B=new THREE.Color(cB),Cc=new THREE.Color(cC),tmp=new THREE.Color();
  for(let i=0;i<=tub;i++){ const t=i/tub;
    if(t<0.5) tmp.copy(A).lerp(B,t*2); else tmp.copy(B).lerp(Cc,(t-0.5)*2);
    for(let j=0;j<=rad;j++){ const k=i*(rad+1)+j; if(k<n){
      cols[k*3]=tmp.r; cols[k*3+1]=tmp.g; cols[k*3+2]=tmp.b; } } }
  geom.setAttribute('color', new THREE.BufferAttribute(cols,3));
  return geom;
}
/* ExtrudeGeometry 的 UV 是形状坐标，重映射到 0..1 */
function remapUV(geom){
  geom.computeBoundingBox(); const b=geom.boundingBox;
  const pos=geom.attributes.position, uv=geom.attributes.uv, t=new THREE.Vector3();
  const w=b.max.x-b.min.x||1, h=b.max.y-b.min.y||1;
  for(let i=0;i<uv.count;i++){ t.fromBufferAttribute(pos,i);
    uv.setXY(i,(t.x-b.min.x)/w,(t.y-b.min.y)/h); }
  return geom;
}
/* 管几何：中心线 + 半径渐变 */
function tubeAlong(points, r0, r1, seg=48, rad=10){
  const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
  const g=new THREE.TubeGeometry(curve, seg, r0, rad, false);
  const pos=g.attributes.position; const per=(rad+1);
  for(let i=0;i<=seg;i++){ const t=i/seg;
    const t2=clamp(t,0,1); const s=lerp(r0,r1,t2)/r0;
    const c=curve.getPoint(t);
    for(let j=0;j<=rad;j++){ const k=i*per+j;
      pos.setXYZ(k, c.x+(pos.getX(k)-c.x)*s, c.y+(pos.getY(k)-c.y)*s, c.z+(pos.getZ(k)-c.z)*s); } }
  g.computeVertexNormals(); return {geom:g, curve};
}

/* =====================================================================
 *  CanvasTexture 工厂：脸 / 围裙刺绣 / 脚下软阴影

function faceTexture(){
  const cv=document.createElement('canvas'); cv.width=cv.height=512;
  const g=cv.getContext('2d');
  const eye=(cx,cy,s)=>{ // 一只眼（对称绘制）

    g.fillStyle='#FFFFFF'; g.beginPath(); g.ellipse(0,0,72,100,0,0,Math.PI*2); g.fill();
    g.fillStyle='#1A3E9C'; g.beginPath(); g.ellipse(0,8,56,86,0,0,Math.PI*2); g.fill();
    g.fillStyle='#2F66C8'; g.beginPath(); g.ellipse(0,-10,50,68,0,0,Math.PI*2); g.fill();
    g.fillStyle='#5FA8E8'; g.beginPath(); g.ellipse(0,-18,34,40,0,0,Math.PI*2); g.fill();
    g.fillStyle='#0B1B3F'; g.beginPath(); g.ellipse(0,22,20,28,0,0,Math.PI*2); g.fill();
    g.fillStyle='rgba(255,255,255,.92)'; g.beginPath(); g.ellipse(-20,-32,18,24,-0.3,0,Math.PI*2); g.fill();
    g.fillStyle='rgba(255,255,255,.65)'; g.beginPath(); g.ellipse(18,30,10,13,0,0,Math.PI*2); g.fill();
    g.strokeStyle='#12224F'; g.lineWidth=16; g.lineCap='round';
    g.beginPath(); g.arc(-4,12,86,Math.PI*1.10,Math.PI*1.90); g.stroke();
    g.strokeStyle='rgba(18,34,79,.28)'; g.lineWidth=5;
    g.beginPath(); g.arc(0,-10,82,Math.PI*1.15,Math.PI*1.85); g.stroke();
    g.restore(); };
  eye(112,238,0.95); eye(400,238,-0.95);
  /* 腮红 */
  const blush=(x,y)=>{ const r=g.createRadialGradient(x,y,6,x,y,52);
    r.addColorStop(0,'rgba(246,148,140,.55)'); r.addColorStop(1,'rgba(246,148,140,0)');
    g.fillStyle=r; g.beginPath(); g.ellipse(x,y,52,40,0,0,Math.PI*2); g.fill(); };
  blush(66,372); blush(446,372);
  /* 微笑 */
  g.strokeStyle='#7A3B3B'; g.lineWidth=10; g.lineCap='round';
  g.beginPath(); g.arc(256,372,40,Math.PI*0.18,Math.PI*0.82); g.stroke();
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4;
  return t;
}
function apronTexture(){
  const cv=document.createElement('canvas'); cv.width=512; cv.height=512;
  const g=cv.getContext('2d');
  g.fillStyle='#F7F7F5'; g.fillRect(0,0,512,512);

  g.fillStyle='#C9A227'; [[86,86],[426,86],[86,426],[426,426]].forEach(([x,y])=>{

    g.closePath(); g.fill(); g.restore(); });
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function blobShadowTexture(){

/* =====================================================================
 *  通用小零件
 * ===================================================================== */
function makeBow(scale, color, knotColor){
  const s=scale; const grp=new THREE.Group();
  const mat=toon(color);
  const wing=()=>{ const sh=new THREE.Shape();
    sh.moveTo(0,0); sh.bezierCurveTo(0.09*s, 0.07*s, 0.16*s, 0.02*s, 0.14*s,-0.05*s);
    sh.bezierCurveTo(0.12*s,-0.10*s, 0.05*s,-0.10*s, 0,-0.06*s);
    sh.bezierCurveTo(-0.05*s,-0.10*s, -0.12*s,-0.10*s, -0.14*s,-0.05*s);
    sh.bezierCurveTo(-0.16*s,0.02*s, -0.09*s,0.07*s, 0,0);
    const g=new THREE.ExtrudeGeometry(sh,{depth:0.012*s,bevelEnabled:true,bevelThickness:0.006*s,bevelSize:0.006*s,bevelSegments:2});
    const m=new THREE.Mesh(g,mat); m.material.side=THREE.DoubleSide; return m; };
  const wl=wing(); wl.position.x=-0.02*s; const wr=wing(); wr.scale.x=-1; wr.position.x=0.02*s;
  const knot=new THREE.Mesh(new THREE.SphereGeometry(0.035*s,10,8), toon(knotColor||color));
  knot.scale.y=0.8;
  grp.add(wl,wr,knot);
  const tails=new THREE.Group();
  for(const sd of[-1,1]){ const sh=new THREE.Shape();
    sh.moveTo(0,0); sh.quadraticCurveTo(0.05*s*sd,-0.1*s,0.02*s*sd,-0.2*s);
    sh.lineTo(-0.03*s*sd,-0.19*s); sh.quadraticCurveTo(-0.02*s*sd,-0.1*s,0,0);
    const g=new THREE.ExtrudeGeometry(sh,{depth:0.008*s,bevelEnabled:false});
    const m=new THREE.Mesh(g,mat); m.position.x=0.01*s*sd; tails.add(m); }
  grp.add(tails);
  return grp;
}
/* 荷叶边圆柱裙（下缘波浪） */
function ruffleSkirt(rTop,rBot,h,segs,color,waves,amp,side){
  const g=new THREE.CylinderGeometry(rTop,rBot,h,segs,1,true);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    const y=p.getY(i);
    if(y<-h/2+h*0.28){ const x=p.getX(i),z=p.getZ(i); const th=Math.atan2(z,x);
      const fall=1-(-y-h*0.22)/(h*0.28);
      p.setY(i, y - (0.5+0.5*Math.sin(th*waves))*amp*fall); } }
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshToonMaterial({color,gradientMap:TOON,side:side||THREE.DoubleSide}));
  return m;
}

/* =====================================================================
 *  主角：蓝鲸女仆（程序化建模）
 * ===================================================================== */
function buildCharacter(){
  const root=new THREE.Group();          // 世界原点：脚底
  const T=root.userData.parts={};
  const body=new THREE.Group(); root.add(body); T.body=body;      // 跳跃高度 + bob
  const hips=new THREE.Group(); hips.position.y=0.44; body.add(hips);

  /* ---- 腿（挂在 hips，pivot 在髋 y=0.40） ---- */
  const mkLeg=(side)=>{
    const hip=new THREE.Group(); hip.position.set(0.105*side,-0.08,0); hips.add(hip);
    const thigh=new THREE.Mesh(new THREE.CylinderGeometry(0.052,0.047,0.20,10),toon(C.tights));
    thigh.position.y=-0.10; hip.add(thigh);
    const knee=new THREE.Group(); knee.position.y=-0.20; hip.add(knee);
    const calf=new THREE.Mesh(new THREE.CylinderGeometry(0.046,0.040,0.15,10),toon(C.tights));
    calf.position.y=-0.075; knee.add(calf);
    /* 玛丽珍鞋 */
    const shoe=new THREE.Group(); shoe.position.set(0,-0.155,0.02); knee.add(shoe);
    const body_=new THREE.Mesh(new THREE.SphereGeometry(0.058,12,10),toon(C.shoe));
    body_.scale.set(0.9,0.62,1.25); body_.position.y=-0.005; shoe.add(body_);
    const strap=new THREE.Mesh(new THREE.TorusGeometry(0.05,0.011,8,16,Math.PI),toon(C.shoe));
    strap.rotation.set(Math.PI/2,0,0); strap.position.set(0,0.004,0.055); shoe.add(strap);
    const buckle=new THREE.Mesh(new THREE.SphereGeometry(0.016,8,6),toon(C.gold));
    buckle.scale.set(1,0.55,0.6); buckle.position.set(0,0.012,0.08); shoe.add(buckle);
    const flower=new THREE.Mesh(new THREE.SphereGeometry(0.014,8,6),toon('#E8C55A'));
    flower.scale.set(1.15,0.5,0.7); flower.position.set(0.03,0.03,0.09); shoe.add(flower);
    thigh.castShadow=calf.castShadow=body_.castShadow=true;
    outline(body_,1.08); outline(thigh,1.07);
    return {hip,knee,shoe};
  };
  T.legL=mkLeg(-1); T.legR=mkLeg(1);

  /* ---- 骨盆 + 裙（裙改短：0.25~0.42，下缘白色裙边可见） ---- */
  const pelvis=new THREE.Mesh(new THREE.SphereGeometry(0.155,14,10),toon(C.navy));

function terrainH(x,z){
  let h = Math.sin(x*0.05)*Math.cos(z*0.045)*0.35
        + Math.sin(x*0.11+1.7)*Math.sin(z*0.09+3.1)*0.15;
  const d=Math.hypot(x,z);
  h*=THREE.MathUtils.smoothstep(d,6,26);   // 广场区基本平整
  return h;
}

  const base=new THREE.Color(0x0C101C), dark=new THREE.Color(0x070A12),
        cyan=new THREE.Color(0x123650), tmp=new THREE.Color();

}

    const a=rnd()*Math.PI*2, r=Math.sqrt(THREE.MathUtils.lerp(minR*minR,maxR*maxR,rnd()));
    const x=Math.sin(a)*r, z=Math.cos(a)*r;
    return {x,z};
  }
}

const towerTex=(seed)=>{
  const c=document.createElement('canvas'); c.width=64; c.height=128;
  const g=c.getContext('2d');
  g.fillStyle='#0A0F1C'; g.fillRect(0,0,64,128);
  const cols=['#2FD8FF','#FFB04A','#FF4FD8','#7FE4FF','#27405E'];
  const r2=mulberry32(seed);
  for(let y=4;y<124;y+=8) for(let x=4;x<60;x+=8){
    if(r2()<0.42){ g.fillStyle=cols[(r2()*cols.length)|0];
      g.globalAlpha=0.3+r2()*0.7; g.fillRect(x,y,5,5); g.globalAlpha=1; }
  }
  const t=new THREE.CanvasTexture(c); t.magFilter=THREE.NearestFilter; return t;
};
const towerMats=[0,1,2,3].map(i=>new THREE.MeshToonMaterial({
  color:0x0D1322, emissive:0xffffff, emissiveMap:towerTex(700+i*131),
  emissiveIntensity:0.85, gradientMap:TOON }));
function makeTower(x,z,w,h,d,mi){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), towerMats[mi%4]);
  m.position.set(x, terrainH(x,z)+h/2, z);
  m.rotation.y=(rnd()*0.5-0.25);
  scene.add(m);
  obstacles.push({x,z,r:Math.max(w,d)*0.55});
  return m;
}
/* ---- 霓虹招牌（CanvasText，加法混合发光） ---- */
function neonSign(w,h,text,color,vertical){
  const c=document.createElement('canvas');
  const fs=90;
  c.width =vertical?fs:(Math.max(64,text.length*fs*0.62));
  c.height=vertical?(Math.max(64,text.length*fs*0.9)):fs;
  const g=c.getContext('2d');
  g.clearRect(0,0,c.width,c.height);
  g.fillStyle=color; g.shadowColor=color; g.shadowBlur=26;
  g.textAlign='center'; g.textBaseline='middle';
  g.font='700 '+fs*0.82+'px sans-serif';
  if(vertical){ for(let i=0;i<text.length;i++)
    g.fillText(text[i], c.width/2, c.height/(text.length+1)*(i+1)); }
  else g.fillText(text, c.width/2, c.height/2);
  const t=new THREE.CanvasTexture(c);
  return new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    new THREE.MeshBasicMaterial({map:t,transparent:true,side:THREE.DoubleSide,
      blending:THREE.AdditiveBlending,depthWrite:false}));
}

/* =====================================================================
 *  v0.1.1 音效 · WebAudio 全合成（无采样文件）
 *  foot 脚步 / jump 起跳 / land 落地 / pickup 拾取 / M 键静音
 * ===================================================================== */
const AudioFX=(()=>{
  let ctx=null,bus=null,muted=false,nSteps=0,nPick=0;
  function ac(){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    if(!ctx){ ctx=new AC(); bus=ctx.createGain(); bus.gain.value=0.85; bus.connect(ctx.destination); }
    if(ctx.state==='suspended') ctx.resume().catch(()=>{});
    return ctx;
  }
  /* 首次交互解锁（浏览器自动播放策略），开始散步按钮必然触发 */
  addEventListener('pointerdown',()=>ac());
  addEventListener('keydown',()=>ac());
  /* 敲击体：噪声脉冲 + 低频心音，脚步与落地共用 */
  function thump(freq,dur,vol,noise){
    if(muted||!ac())return;
    const t0=ctx.currentTime;
    if(noise){
      const n=Math.max(8,(ctx.sampleRate*dur)|0);
      const buf=ctx.createBuffer(1,n,ctx.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.4);
      const s=ctx.createBufferSource(); s.buffer=buf;
      const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq*4; f.Q.value=0.7;
      const g=ctx.createGain(); g.gain.value=vol;
      s.connect(f); f.connect(g); g.connect(bus); s.start(t0);
    }
    const o=ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(freq,t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(38,freq*0.42),t0+dur);
    const og=ctx.createGain();
    og.gain.setValueAtTime(vol,t0);
    og.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    o.connect(og); og.connect(bus); o.start(t0); o.stop(t0+dur+0.02);
  }
  /* 短音：起跳 / 拾取琶音 */
  function tone(f0,f1,dur,vol,type,delay){
    if(muted||!ac())return;
    const t0=ctx.currentTime+(delay||0);
    const o=ctx.createOscillator(); o.type=type||'triangle';
    o.frequency.setValueAtTime(f0,t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t0+dur);
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol,t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.0008,t0+dur);
    o.connect(g); g.connect(bus); o.start(t0); o.stop(t0+dur+0.03);
  }
  return {
    foot(run){ nSteps++; thump(run?120:170,run?0.090:0.075,run?0.40:0.24,true);
               tone(run?150:210,run?70:95,0.07,run?0.14:0.10,'sine'); },
    jump(){ tone(300,660,0.15,0.16); },
    land(v){ thump(Math.max(55,90-v*4),0.13,Math.min(0.5,0.22+v*0.05),true); },
    pickup(){ nPick++; tone(660,660,0.12,0.14,'sine');
              tone(880,880,0.14,0.15,'sine',0.08);
              tone(1320,1320,0.20,0.13,'sine',0.16); },
    toggle(){ muted=!muted; if(!muted)ac(); return muted; },
    get muted(){return muted;},
    get running(){return !!(ctx&&ctx.state==='running');},
    get stats(){return{steps:nSteps,pick:nPick};}
  };
})();

const joyState={x:0,y:0,active:false,id:null};
if('ontouchstart' in window) document.body.classList.add('touch');
const joyEl=document.getElementById('joy'), knob=document.getElementById('joyKnob');
function joyUpdate(t){ const r=joyEl.getBoundingClientRect();
  let dx=t.clientX-(r.left+r.width/2), dy=t.clientY-(r.top+r.height/2);
  const d=Math.hypot(dx,dy), m=r.width*0.38;
  if(d>m){dx*=m/d;dy*=m/d;}
  joyState.x=dx/m; joyState.y=dy/m;
  knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`; }
joyEl.addEventListener('touchstart',e=>{ joyState.active=true; joyState.id=e.changedTouches[0].identifier;
  joyUpdate(e.changedTouches[0]); e.preventDefault(); },{passive:false});
joyEl.addEventListener('touchmove',e=>{ for(const t of e.changedTouches) if(t.identifier===joyState.id) joyUpdate(t);
  e.preventDefault(); },{passive:false});
joyEl.addEventListener('touchend',e=>{ joyState.active=false; joyState.x=joyState.y=0;
  knob.style.transform='translate(-50%,-50%)'; });

const camS={yaw:Math.PI, pitch:0.30, dist:3.0, tYaw:Math.PI, tPitch:0.30, tDist:3.0};
let dragging=false,lastX=0,lastY=0,pinchD=0;
const cvs=renderer.domElement;
cvs.addEventListener('pointerdown',e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; cvs.setPointerCapture(e.pointerId); });
cvs.addEventListener('pointermove',e=>{ if(!dragging)return;
  camS.tYaw-=(e.clientX-lastX)*0.0052; camS.tPitch=clamp(camS.tPitch+(e.clientY-lastY)*0.0038,0.02,1.15);
  lastX=e.clientX; lastY=e.clientY; });
cvs.addEventListener('pointerup',()=>dragging=false);
cvs.addEventListener('pointercancel',()=>dragging=false);
cvs.addEventListener('wheel',e=>{ camS.tDist=clamp(camS.tDist+e.deltaY*0.0016,1.6,5.4); },{passive:true});
cvs.addEventListener('touchmove',e=>{ if(e.touches.length===2){
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  if(pinchD) camS.tDist=clamp(camS.tDist-(d-pinchD)*0.01,1.6,5.4);
  pinchD=d; } else pinchD=0; },{passive:true});
cvs.addEventListener('touchend',()=>pinchD=0);

function update(dt){
  elapsed+=dt;
  const st=girl.userData.state;
  const t=elapsed;

  /* ---- 相机 ---- */
  if(mode==='preview'&&!dragging){ camS.tYaw+=dt*0.22; }
  camS.yaw=lerpAngle(camS.yaw,camS.tYaw,1-Math.pow(0.0001,dt));
  camS.pitch=lerp(camS.pitch,camS.tPitch,1-Math.pow(0.0001,dt));
  camS.dist=lerp(camS.dist,camS.tDist,1-Math.pow(0.0001,dt));
  const focusY = mode==='preview' ? 0.80 : 0.75;
  const tgt=new THREE.Vector3(girl.position.x, girl.position.y+focusY, girl.position.z);
  const ch=Math.cos(camS.pitch)*camS.dist, vv=Math.sin(camS.pitch)*camS.dist;
  const camPos=new THREE.Vector3(tgt.x+Math.sin(camS.yaw)*ch, tgt.y+vv, tgt.z+Math.cos(camS.yaw)*ch);
  camPos.y=Math.max(camPos.y, terrainH(camPos.x,camPos.z)+0.32);
  camera.position.copy(camPos); camera.lookAt(tgt);
  const sp01=clamp(st.speed/3.4,0,1);
  camera.fov=lerp(camera.fov, 55+sp01*5, 0.08); camera.updateProjectionMatrix();

  /* ---- 输入 → 期望速度 ---- */
  let ix=0,iz=0;
  if(mode==='play'){
    if(keys.KeyW||keys.ArrowUp)iz+=1; if(keys.KeyS||keys.ArrowDown)iz-=1;
    if(keys.KeyA||keys.ArrowLeft)ix+=1; if(keys.KeyD||keys.ArrowRight)ix-=1;
    ix+=joyState.x; iz+=-joyState.y;
  }
  const run=keys.ShiftLeft||keys.ShiftRight;
  let mx=0,mz=0;
  const focrow={f:{x:-Math.sin(camS.yaw),z:-Math.cos(camS.yaw)}};
  const F=focrow.f, R={x:-Math.cos(camS.yaw),z:Math.sin(camS.yaw)};
  let iLen=Math.hypot(ix,iz);
  if(iLen>0.01){
    if(iLen>1){ix/=iLen;iz/=iLen;}
    mx=F.x*iz+R.x*ix; mz=F.z*iz+R.z*ix;
  }
  const mLen=Math.hypot(mx,mz);
  const target=(mLen>0.01)?(run?3.4:1.9)*(mLen):0;
  st.speed=lerp(st.speed,target,1-Math.pow(0.002,dt));
  if(mLen>0.01){ mx/=mLen||1; mz/=mLen||1; }
  const dirYaw=(mLen>0.01)?Math.atan2(mx,mz):st.yaw;
  st.yaw=lerpAngle(st.yaw,dirYaw,1-Math.pow(0.00005,dt));
  girl.rotation.y=st.yaw;

  /* ---- 移动 + 碰撞 ---- */
  const sp=st.speed; let nx=girl.position.x+mx*sp*dt/ (mLen||1) * (mLen||1);
  // 上面写复杂了，直接位移：
  const stepx=mx*sp*dt, stepz=mz*sp*dt;
  nx=girl.position.x+stepx; const nz=girl.position.z+stepz;
  let px=nx,pz=nz;
  for(const o of obstacles){
    const d=Math.hypot(px-o.x,pz-o.z),min=o.r+0.30;
    if(d<min&&d>1e-4){ px=o.x+(px-o.x)/d*min; pz=o.z+(pz-o.z)/d*min; }
  }
  const bd=Math.hypot(px,pz);
  if(bd>92){ px*=92/bd; pz*=92/bd; }
  girl.position.x=px; girl.position.z=pz;

  /* ---- 跳跃 ---- */
  const gy=terrainH(px,pz);
  if((keys.Space)&&st.grounded&&mode==='play'){ st.vy=4.9; st.grounded=false; AudioFX.jump(); }
  if(!st.grounded){
    st.vy-=13.5*dt; st.y+=st.vy*dt;
    if(st.y<=0){
      const impact=-st.vy;
      st.y=0; st.vy=0; st.grounded=true;
      if(impact>1.2) AudioFX.land(impact);
    }
  }
  st.airT=lerp(st.airT, st.grounded?0:1, 1-Math.pow(0.0005,dt));
  girl.position.y=gy+st.y;

  /* ---- 行走相位：步频绑定位移（防滑步） ---- */
  st.phase+=dt*sp*5.9;
  /* ---- v0.1.1 脚步声：相位每过半步触发一次 ---- */
  if(st.grounded&&sp>0.5){
    const sIdx=Math.floor(st.phase/Math.PI);
    if(sIdx>st.step){ st.step=sIdx; AudioFX.foot(run); }
  }
  const ph=st.phase, swing=sp01;
  const legA=lerp(0.5,0.78,swing);
  P.legL.hip.rotation.x = Math.sin(ph)*legA*(1-st.airT) + st.airT*(-0.35);
  P.legR.hip.rotation.x = Math.sin(ph+Math.PI)*legA*(1-st.airT) + st.airT*(-0.15);
  P.legL.knee.rotation.x= (0.18+Math.max(0,-Math.sin(ph-0.5))*0.85)*(1-st.airT) + st.airT*1.15;
  P.legR.knee.rotation.x= (0.18+Math.max(0,-Math.sin(ph+Math.PI-0.5))*0.85)*(1-st.airT) + st.airT*0.9;
  P.armL.sh.rotation.x  = -Math.sin(ph)*lerp(0.42,0.7,swing)*(1-st.airT) + st.airT*(-0.5);
  P.armR.sh.rotation.x  = Math.sin(ph)*lerp(0.42,0.7,swing)*  (1-st.airT) + st.airT*(-0.5);
  P.armL.sh.rotation.z  = 0.52+swing*0.06; P.armR.sh.rotation.z = -0.52-swing*0.06;
  P.armL.elbow.rotation.x=-(0.25+swing*0.35)- st.airT*0.3;
  P.armR.elbow.rotation.x=-(0.25+swing*0.35)- st.airT*0.3;
  P.armL.elbow.rotation.z=0.26; P.armR.elbow.rotation.z=-0.26;
  /* 全身 bob + 前倾 */
  P.body.position.y=Math.abs(Math.sin(ph))*0.03*swing + (st.grounded?0:0.02);
  P.body.rotation.x=swing*0.05+st.airT*0.06;
  P.torsoG.rotation.x=Math.sin(ph*2)*0.02*swing;
  P.headG.rotation.x=-swing*0.03+Math.sin(t*1.7)*0.012;
  P.headG.rotation.z=Math.sin(ph)*0.02*swing;
  /* 呼吸 */
  const br=1+Math.sin(t*2.3)*0.008;
  P.torsoG.scale.set(1,br,1);

  /* ---- 尾巴 ---- */
  P.tailJ.rotation.y=Math.sin(t*2.4)*0.16*(1+swing*1.4)+Math.sin(ph)*0.06*swing;
  P.tailJ.rotation.x=Math.sin(ph*2+0.8)*0.06*swing - 0.02 + Math.sin(t*1.3)*0.03;
  P.flukeG.rotation.z=Math.sin(t*1.6)*0.12;

  /* ---- 头发 / 耳 / 裙 摆动 ---- */
  P.hairSway.forEach((m,i)=>{ const s=(i%2?1:-1);
    m.rotation.x=Math.sin(t*2.2+i*1.1)*0.038 - 0.42*swing*Math.abs(Math.sin(ph+i));
    m.rotation.z=Math.sin(t*1.9+i*0.8)*0.025*s; });
  P.ahoge.rotation.z=Math.sin(t*3.1)*0.12+Math.sin(ph)*0.05*swing;
  P.earL.rotation.z=0.25+Math.sin(t*2.6)*0.03+swing*Math.sin(ph)*0.03;
  P.earR.rotation.z=-0.25-Math.sin(t*2.6+0.5)*0.03-swing*Math.sin(ph)*0.03;
  P.skirtG.rotation.y=Math.sin(ph)*0.07*swing;
  P.skirtG.rotation.z=Math.sin(ph)*0.045*swing;

  /* ---- 软阴影贴片 ---- */
  P.blob.position.y=gy+0.03-girl.position.y+ (0.03);
  P.blob.position.set(0,gy-girl.position.y+0.035,0);
  P.blob.material.opacity=clamp(1-st.y*1.3,0.25,1);
  P.blob.scale.setScalar(1+st.y*0.5);

  /* ---- 光点 ---- */
  let alive=0;
  for(const o of orbGroup.children){
    const u=o.userData;
    if(u.alive)alive++;
    o.position.y=u.baseY+Math.sin(t*2+u.ph)*0.09;
    o.rotation.y+=dt*2.2;
    u.halo.material.opacity=0.35+Math.sin(t*3+u.ph)*0.2;
    if(u.alive&&mode==='play'){
      if(Math.hypot(px-o.position.x,pz-o.position.z)<0.62){
        u.alive=false; o.visible=false; u.halo.material.opacity=0;
        score++; scoreEl.textContent=`${score} / ${TOTAL}`;
        burst(o.position);
        AudioFX.pickup();
        if(score===TOTAL){ toast('全部光点收集完成！鲸鱼尾为你摆动 🐳'); P.tailJ.rotation.y=0.5; }
        else if(score%6===0) toast(`已收集 ${score} 个光点`);
      }
    }
  }
  /* 粒子 */
  for(const f of fxPool){ if(f.life>0){ f.life-=dt*1.6;
    f.m.scale.setScalar(1+(1-f.life)*4);
    f.m.material.opacity=Math.max(0,f.life)*0.8;
    if(f.life<=0)f.m.visible=false; } }
  /* 云 */
  for(const c of clouds){ c.position.x+=dt*0.4; if(c.position.x>150)c.position.x=-150; }
  /* 雨 & 飞车 */
  updateRain(dt,camera.position);
  drone.position.x+=dt*6;
  if(drone.position.x>60) drone.position.x=-60;
  drone.position.y=26+Math.sin(t*0.5)*1.5;
  drone.rotation.z=Math.sin(t*0.7)*0.05;
  drone.userData.beacon.material.color.setHex(Math.sin(t*6)>0?0xFF3B30:0x7A1512);
  /* 水滩反光微颤（雨涟漪） */
  for(const rp of reflPool){
    const u=rp.userData;
    rp.material.opacity=u.baseOp*(0.72+0.28*Math.sin(t*1.7+u.ph));
    if(u.kind==='pud') rp.scale.x=1+0.06*Math.sin(t*2.1+u.ph);
  }
}

/* =====================================================================
 *  启动
 * ===================================================================== */
girl.position.set(0,terrainH(0,0),0);
girl.userData.state={yaw:0,speed:0,phase:0,vy:0,y:0,airT:0,grounded:true,step:0};
scoreEl.textContent=`0 / ${TOTAL}`;
setMode('preview');

renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.05);
  update(dt); renderer.render(scene,camera);
});
/* 移除 loader（首帧渲染后） */
requestAnimationFrame(()=>requestAnimationFrame(()=>{
  document.getElementById('loader').classList.add('off');
}));
/* ---- 自查调试钩子（不参与游戏逻辑） ---- */
window.__dbg = {camS, setMode, girl, P, keys, update, scene, camera, renderer, audio:AudioFX};
window.__T = THREE;
window.__dbg.shots = {};
window.__dbg.stop = ()=>renderer.setAnimationLoop(null);
window.__dbg.start = ()=>{ clock.getDelta(); renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.05); update(dt); renderer.render(scene,camera); }); };
window.__save = (name, angle, fn)=>{
  window.__dbg.stop();
  if(typeof fn==='function') fn();
  window.__dbg.shots[name]=__snap(680, angle);
  const a=document.createElement('a'); a.href=window.__dbg.shots[name]; a.download=name||'snap.jpg';
  document.body.appendChild(a); a.click(); a.remove();
  return name;
};
window.__shot = (name, cam)=>{
  window.__dbg.stop();
  if(cam){ camS.yaw=camS.tYaw=cam.yaw; camS.pitch=camS.tPitch=cam.pitch; camS.dist=camS.tDist=cam.dist; }
  window.__dbg.shots[name]=__snap(680);
  const a=document.createElement('a'); a.href=window.__dbg.shots[name]; a.download=name||'snap.jpg';
  document.body.appendChild(a); a.click(); a.remove();
  return name;
};
window.__snap = (w=760, angle)=>{
  if(typeof angle==='number'){ camS.yaw=camS.tYaw=angle; camS.pitch=camS.tPitch=0.16; camS.dist=camS.tDist=2.3; }
  update(0.001);
  renderer.render(scene,camera);
  const src=renderer.domElement;
  const c=document.createElement('canvas');
  c.width=w; c.height=Math.round(w*src.height/src.width);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.82);
};
</script>
